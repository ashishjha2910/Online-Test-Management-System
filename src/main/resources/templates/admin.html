<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin | Online Test</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar"><a class="brand" th:href="@{/dashboard}">Online Test</a><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></header>
<main class="container">
  <h1>Assessment administration</h1>
  <section class="card">
    <h2>Create assessment</h2>
    <form method="post" th:action="@{/admin/quizzes}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Title</label><input name="title" maxlength="150" required>
      <label>Description</label><textarea name="description" rows="2" maxlength="1000"></textarea>
      <button type="submit">Create assessment</button>
    </form>
  </section>
  <section class="card" th:each="quiz : ${quizzes}">
    <h2 th:text="${quiz.title}"></h2>
    <p class="muted" th:text="${quiz.description}"></p>
    <p th:text="${#lists.size(quiz.questions)} + ' questions · ' + (quiz.active ? 'Active' : 'Inactive')"></p>
    <form method="post" th:action="@{/admin/quizzes/{id}/questions(id=${quiz.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Question</label><input name="questionText" maxlength="1000" required>
      <label>Options (one per line, 2–6 options)</label><textarea name="options" rows="4" required></textarea>
      <label>Correct answer (must exactly match one option)</label><input name="correctAnswer" required>
      <button type="submit">Add question</button>
    </form>
    <form method="post" th:action="@{/admin/quizzes/{id}/toggle(id=${quiz.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="secondary" type="submit" th:text="${quiz.active ? 'Deactivate' : 'Activate'}"></button>
    </form>
  </section>
</main>
</body></html>
