<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Online Test</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-card">
  <h1>Online Test</h1><p class="muted">Sign in to continue to your assessments.</p>
  <p class="success" th:if="${param.registered}">Account created. Please sign in.</p>
  <p class="muted" th:if="${param.logout}">You have been signed out.</p>
  <p class="error" th:if="${param.error}">Invalid email or password.</p>
  <form method="post" th:action="@{/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Email</label><input type="email" name="username" required autocomplete="email">
    <label>Password</label><input type="password" name="password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p>New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body></html>
