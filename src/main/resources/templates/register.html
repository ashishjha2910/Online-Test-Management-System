<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | Online Test</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-card">
  <h1>Create account</h1><p class="muted">Register to access available tests.</p>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <form method="post" th:action="@{/register}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Email</label><input type="email" name="email" th:value="${email}" required autocomplete="email">
    <label>Password</label><input type="password" name="password" minlength="8" required autocomplete="new-password">
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body></html>
